<mjml>
  <mj-head>
    <mj-title>{{email_title}}</mj-title>
    <mj-preview>{{email_preview}}</mj-preview>
    <mj-attributes>
      <mj-all font-family="'DM Sans', Arial, sans-serif" />
      <mj-section background-color="#ffffff" padding="0 36px" />
      <mj-text color="#0f1729" font-size="15px" line-height="1.6" padding="0" />
      <mj-button background-color="#6467f2" color="#000000" border-radius="8px" font-weight="700" inner-padding="14px 28px" align="left" />
      <mj-class name="h" font-weight="700" />
    </mj-attributes>
  </mj-head>
  <mj-body background-color="#f6f7f9">
    <mj-section background-color="#6467f2" padding="20px 36px">
      <mj-column>
        <mj-image src="https://media.base44.com/images/public/6a201f5ce89c0f167dbe847d/0007ca5ee_OPERAPPLOGO.png" alt="OPERAPP360" width="140px" align="left" padding="0 0 8px 0" />
        <mj-text color="#000000" font-size="18px" font-weight="700" padding="0">OPERAPP360</mj-text>
      </mj-column>
    </mj-section>

    <mj-section padding="40px 36px 8px">
      <mj-column>
        <mj-text mj-class="h" font-size="26px" line-height="1.2">{{email_heading}}</mj-text>
        <mj-text color="#6b7280" font-size="15px" padding="8px 0 0 0">{{email_subtitle}}</mj-text>
      </mj-column>
    </mj-section>

    <mj-section padding="8px 36px 12px">
      <mj-column>
        <mj-text>{{email_body1}}</mj-text>
        <mj-text>{{email_body2}}</mj-text>
        <mj-button href="https://oper-core-flow.base44.app">{{email_button}}</mj-button>
      </mj-column>
    </mj-section>

    <mj-section background-color="#ffffff" padding="24px 36px">
      <mj-column>
        <mj-text color="#6b7280" font-size="12px">{{email_footer}}</mj-text>
      </mj-column>
    </mj-section>
  </mj-body>
</mjml>
